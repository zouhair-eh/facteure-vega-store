<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0f0f13"/>
  <rect width="512" height="512" rx="80" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c63ff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- V letter -->
  <text x="256" y="340" font-family="Arial Black, sans-serif" font-size="280" font-weight="900" fill="white" text-anchor="middle">V</text>
  <!-- Chart line -->
  <polyline points="80,400 160,300 240,350 340,200 430,220" stroke="#10b981" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
